name: CI

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npx turbo run build --filter=@repo/api --filter=@repo/jest-config

      - name: Generate API types
        run: npm run generate:api

      - name: Lint
        run: npm run lint:all

      - name: Typecheck
        run: npm run typecheck:all
