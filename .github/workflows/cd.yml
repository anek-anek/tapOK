name: CD

on:
  push:
    branches:
      - main
      - staging

jobs:
  generate-types:
    name: Generate API Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npx turbo run build --filter=@repo/api

      - name: Generate API types
        run: npm run generate:api

      - name: Upload generated types
        uses: actions/upload-artifact@v4
        with:
          name: api-types
          path: |
            packages/api/openapi.json
            packages/api/src/schema.d.ts

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && format('Production – {0}', vars.VERCEL_PROJECT_NAME_API) || format('Preview – {0}', vars.VERCEL_PROJECT_NAME_API) }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Run database migrations
        run: |
          ENV_FILE="${GITHUB_WORKSPACE}/.vercel/.env.${{ github.ref_name == 'main' && 'production' || 'preview' }}.local"
          if [ -f "$ENV_FILE" ]; then
            set -a && source "$ENV_FILE" && set +a
          fi
          npm run migration:run --workspace=api

      - name: Build API
        run: npx turbo run build --filter=api

      - name: Build Vercel output
        env:
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_SLUG: ${{ github.repository }}
        run: vercel build ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt
        env:
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_SLUG: ${{ github.repository }}
        run: vercel deploy --prebuilt ${{ github.ref_name == 'main' && '--prod' || '--target=preview' }} --token=${{ secrets.VERCEL_TOKEN }}

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [generate-types, deploy-api]
    environment: ${{ github.ref_name == 'main' && format('Production – {0}', vars.VERCEL_PROJECT_NAME_WEB) || format('Preview – {0}', vars.VERCEL_PROJECT_NAME_WEB) }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download generated types
        uses: actions/download-artifact@v4
        with:
          name: api-types
          path: packages/api

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        env:
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_SLUG: ${{ github.repository }}
        run: vercel deploy ${{ github.ref_name == 'main' && '--prod' || '--target=preview' }} --token=${{ secrets.VERCEL_TOKEN }}
